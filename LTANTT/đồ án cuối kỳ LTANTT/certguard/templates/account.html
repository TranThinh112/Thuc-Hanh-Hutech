{% extends "base.html" %}
{% block title %}Tài khoản{% endblock %}
{% block content %}
<div class="pagehead"><h1>Đổi mật khẩu</h1></div>
<section class="card narrow">
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Mật khẩu hiện tại<input type="password" name="old" required autocomplete="current-password"></label>
    <label>Mật khẩu mới<input type="password" name="new" required autocomplete="new-password"></label>
    <label>Nhập lại mật khẩu mới<input type="password" name="confirm" required autocomplete="new-password"></label>
    <button class="btn primary">Đổi mật khẩu</button>
  </form>
</section>
{% endblock %}
