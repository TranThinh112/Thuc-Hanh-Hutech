# Cấu hình TLS CỐ TÌNH yếu để kiểm thử: bật TLS 1.0/1.1, cipher cũ, không HSTS
# (Mô phỏng một máy chủ cũ chưa được cập nhật — tình huống rất hay gặp ngoài thực tế)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers "ALL:@SECLEVEL=0";
    ssl_prefer_server_ciphers on;

    # Không có header Strict-Transport-Security

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }
}
