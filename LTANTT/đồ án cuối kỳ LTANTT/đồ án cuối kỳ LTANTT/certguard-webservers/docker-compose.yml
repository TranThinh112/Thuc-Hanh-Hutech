# Các web server demo cho CertGuard: 7 web server Nginx thật, mỗi server một kiểu chứng thư/cấu hình.
# Chạy:  docker compose up -d      Dừng:  docker compose down

x-nginx: &nginx
  image: nginx:1.27-alpine
  restart: unless-stopped

services:
  good:
    <<: *nginx
    container_name: web-good
    ports: ["8443:443"]
    volumes:
      - ./nginx/standard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/good:/etc/nginx/certs:ro
      - ./html/good:/usr/share/nginx/html:ro

  expiring:
    <<: *nginx
    container_name: web-expiring
    ports: ["8444:443"]
    volumes:
      - ./nginx/standard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/expiring:/etc/nginx/certs:ro
      - ./html/expiring:/usr/share/nginx/html:ro

  expired:
    <<: *nginx
    container_name: web-expired
    ports: ["8445:443"]
    volumes:
      - ./nginx/standard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/expired:/etc/nginx/certs:ro
      - ./html/expired:/usr/share/nginx/html:ro

  selfsigned:
    <<: *nginx
    container_name: web-selfsigned
    ports: ["8446:443"]
    volumes:
      - ./nginx/standard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/selfsigned:/etc/nginx/certs:ro
      - ./html/selfsigned:/usr/share/nginx/html:ro

  wronghost:
    <<: *nginx
    container_name: web-wronghost
    ports: ["8447:443"]
    volumes:
      - ./nginx/standard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/wronghost:/etc/nginx/certs:ro
      - ./html/wronghost:/usr/share/nginx/html:ro

  incomplete:
    <<: *nginx
    container_name: web-incomplete
    ports: ["8448:443"]
    volumes:
      - ./nginx/standard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/incomplete:/etc/nginx/certs:ro
      - ./html/incomplete:/usr/share/nginx/html:ro

  weak:
    <<: *nginx
    container_name: web-weak
    ports: ["8449:443"]
    environment:
      # Hạ mức bảo mật của OpenSSL trong container để Nginx chấp nhận khóa 1024 bit và TLS 1.0
      OPENSSL_CONF: /etc/ssl/openssl-weak.cnf
    volumes:
      - ./nginx/weak.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/openssl-weak.cnf:/etc/ssl/openssl-weak.cnf:ro
      - ./certs/weak:/etc/nginx/certs:ro
      - ./html/weak:/usr/share/nginx/html:ro
