{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="login card">
  <div class="login-head">
    <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.9-4.9 1.4 1.4z"/></svg>
    <h1>CertGuard</h1>
    <p class="muted">Quản lý &amp; kiểm tra chứng thư số SSL/TLS</p>
  </div>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Tên đăng nhập<input name="username" autocomplete="username" required autofocus></label>
    <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary full">Đăng nhập</button>
  </form>
</div>
{% endblock %}
