<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ứng Dụng Đăng Nhập Fullstack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="background-decorations">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <main class="container">
    <!-- Card Đăng Nhập -->
    <section class="card" id="loginCard">
      <div class="card-header">
        <div class="badge">Bài Tập Thực Hành</div>
        <h1 class="card-title">Hệ Thống Đăng Nhập</h1>
        <p class="card-subtitle">Ứng dụng Web Client - Server Fullstack (Express & Vanilla JS)</p>
      </div>

      <!-- Thông báo alert -->
      <div id="alertMessage" class="alert hidden" role="alert">
        <span class="alert-icon" id="alertIcon"></span>
        <span class="alert-text" id="alertText"></span>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username" class="form-label">Tên đăng nhập</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-input" 
              placeholder="Nhập username (ví dụ: admin)"
              autocomplete="username"
            >
          </div>
          <small class="error-feedback" id="usernameError"></small>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Mật khẩu</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="Nhập password (ví dụ: 12345)"
              autocomplete="current-password"
            >
            <button type="button" id="togglePasswordBtn" class="toggle-password" title="Ẩn/Hiện mật khẩu">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <small class="error-feedback" id="passwordError"></small>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">
          <span class="btn-text">Đăng nhập</span>
          <span class="btn-loader hidden" id="btnLoader"></span>
        </button>
      </form>

      <div class="demo-hints">
        <p class="hint-title">💡 Tài khoản thử nghiệm:</p>
        <div class="hint-credentials">
          <span>Username: <code>admin</code></span>
          <span>Password: <code>12345</code></span>
        </div>
      </div>
    </section>

    <!-- Card Sau khi đăng nhập thành công -->
    <section class="card hidden" id="dashboardCard">
      <div class="card-header success-header">
        <div class="success-icon-wrap">
          <svg class="success-svg" xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <h2 class="card-title">Đăng Nhập Thành Công!</h2>
        <p class="card-subtitle">Phiên làm việc (Session) đã được lưu trên máy chủ.</p>
      </div>

      <div class="user-details-card">
        <div class="info-row">
          <span class="info-label">Tài khoản:</span>
          <span class="info-value" id="currentUsername">---</span>
        </div>
        <div class="info-row">
          <span class="info-label">Vai trò:</span>
          <span class="info-value" id="currentUserRole">---</span>
        </div>
        <div class="info-row">
          <span class="info-label">Thời gian đăng nhập:</span>
          <span class="info-value" id="currentLoginTime">---</span>
        </div>
      </div>

      <button id="logoutBtn" class="btn btn-outline">
        <span>Đăng xuất</span>
      </button>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
